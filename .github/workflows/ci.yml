name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  app:
    name: Lint, typecheck e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  banco:
    name: Migrations e testes de RLS (pgTAP)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Instala pgTAP no container do Postgres
        run: |
          CID=$(docker ps -q --filter ancestor=postgres:16)
          docker exec "$CID" bash -c "apt-get update -qq && apt-get install -y -qq postgresql-16-pgtap > /dev/null"
      - name: Aplica migrations e roda os testes
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash supabase/tests/run-local.sh
